
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Glow & Grace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" href="Images/g&glogo1.png">

    <link rel="stylesheet" href="booking.css">
    <script src="booking.js"></script>
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <!-- LOGO -->
            <a href="index.html" class="login-logo">
                <img src="Images/g&glogo1.png" alt="Glow & Grace Logo">
            </a>

            <!-- HEADING -->
            <div class="login-heading">

                <span class="login-subtitle">WELCOME BACK</span>

                <h1>Sign In</h1>

                <p>Your Glow, Your Signature</p>

            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            minlength="6"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- REMEMBER / FORGOT -->
                <div class="login-options">

                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button type="submit" class="login-submit">
                    Sign In
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <p id="loginStatus" class="login-status" aria-live="polite"></p>

            </form>


            <!-- REGISTER LINK -->
            <div class="register-link">
                <p>
                    Don't have an account?
                    <a href="booking.html">Create Account</a>
                </p>
            </div>


            <!-- BACK HOME -->
            <a href="index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Home
            </a>

        </div>

    </main>

    

</body>
</html>
